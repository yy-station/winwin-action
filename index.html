<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9B94B8">
<meta name="apple-mobile-web-app-title" content="winwin行动">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>winwin行动</title>
<style>
/* ====== Cute Morandi Design Tokens ====== */
:root{
  /* 紫蓝莫兰迪：主色调不变，提升对比度 */
  --bg:#FBFAFD; --bg2:#EDE8F7; --bg3:#E6E1F2; --bg4:#DDD6EC;
  --card:#FFFFFF; --card2:#F6F4FB; --card3:#EDEAF5;
  --input:#F2EFF8;
  --t1:#332E44; --t2:#5A5470; --t3:#8E87A4; --t4:#C4BED6;
  --rose:#C48A96; --sage:#7FB38A; --blue:#6A8FC0; --taupe:#8E7FA3;
  --lav:#9B94B8; --lav2:#7E759E; --lav3:#B8B0D0;
  --coral:#D49AA6; --mint:#8BB5B5; --gold:#C4B89A;
  --bd:#DDD7EB; --bd2:#EAE6F3; --bd3:#F2EFF7;
  --r:22px; --rs:16px; --rl:26px; --rxl:30px;
  --sh:0 6px 20px rgba(51,46,68,.07);
  --sh2:0 10px 30px rgba(51,46,68,.12);
  --sh3:0 3px 10px rgba(51,46,68,.06);
  --sw:210px;
  --tw:.28s cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  background:linear-gradient(145deg,#FAF9FD 0%,#F2EFF8 45%,#EAE5F3 100%);
  color:var(--t1);font-size:15.5px;line-height:1.65;
  font-weight:450;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15.5px;border:none;outline:none;background:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--t4);border-radius:5px}

/* ====== Password Gate ====== */
#gate{position:fixed;inset:0;background:linear-gradient(145deg,#FAF9FD 0%,#F2EFF8 45%,#EAE5F3 100%);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .45s}
#gate.hidden{opacity:0;pointer-events:none}
.gate-box{background:var(--card);border-radius:var(--rxl);padding:44px 34px;width:88%;max-width:360px;text-align:center;box-shadow:var(--sh2)}
.gate-icon{width:100px;height:100px;border-radius:50%;margin-bottom:14px;background:linear-gradient(135deg,var(--lav3),var(--lav));display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;box-shadow:var(--sh2);transition:transform var(--tw);border:3px solid rgba(255,255,255,.6)}
.gate-icon:hover{transform:scale(1.06)}
.gate-title{font-size:22px;font-weight:800;color:var(--t1);margin-bottom:6px;letter-spacing:-.3px}
.gate-sub{font-size:13.5px;color:var(--t2);margin-bottom:26px;font-weight:500}
.gate-input{width:100%;height:52px;background:var(--input);border-radius:var(--rs);padding:0 18px;text-align:center;font-size:18px;letter-spacing:3px;border:2px solid var(--bd);transition:all var(--tw);font-weight:500}
.gate-input:focus{border-color:var(--lav);background:#fff;box-shadow:0 0 0 4px rgba(155,148,184,.12)}
#gateEmail{letter-spacing:0;font-size:15.5px}
.gate-btn{width:100%;height:50px;margin-top:16px;background:var(--t1);color:#fff;border-radius:var(--rs);font-size:16px;font-weight:700;transition:all var(--tw);box-shadow:0 6px 18px rgba(51,46,68,.18)}
.gate-btn:hover{transform:scale(1.03);box-shadow:0 8px 24px rgba(51,46,68,.24)}
.gate-btn:active{transform:scale(.97)}
.gate-hint{font-size:12.5px;color:var(--t3);margin-top:18px;font-weight:500}
.gate-switch{display:none;margin-top:14px;font-size:13px;color:var(--lav2);cursor:pointer;font-weight:600;transition:color .2s}
.gate-switch:hover{color:var(--t1)}

/* ====== Layout ====== */
#app{display:flex;height:100vh;height:100dvh}        /* 100vh fallback + 100dvh 适配 iPhone 17 动态地址栏 */

/* ====== Sidebar ====== */
#sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex-shrink:0;z-index:100;transition:transform var(--tw);padding:14px 8px 10px;box-sizing:border-box}
.sidebar-head{padding:6px 6px 12px;display:flex;align-items:center;gap:10px}
.sidebar-head .logo{font-size:24px;transition:transform var(--tw)}
.sidebar-head .logo:hover{transform:scale(1.1) rotate(-4deg)}
.sidebar-head .name{font-size:15.5px;font-weight:800;color:var(--t1);line-height:1.2;letter-spacing:-.3px}
.sidebar-head .name small{display:block;font-size:10.5px;font-weight:600;color:var(--t2);margin-top:2px}
.nav-group-label{font-size:10px;font-weight:800;color:var(--t3);padding:8px 6px 4px;text-transform:uppercase;letter-spacing:1px}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:7px 5px;margin-bottom:5px;font-size:12px;color:var(--t2);
  background:transparent;border-radius:12px;box-shadow:none;
  transition:all var(--tw);cursor:pointer;position:relative;text-align:center;
  border:1px solid transparent;min-height:66px;line-height:1.25
}
.nav-item .ico{font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;line-height:1;transition:all var(--tw)}
.nav-item .lbl{white-space:normal;overflow:visible;text-overflow:clip;max-width:100%;font-weight:600;line-height:1.25;max-height:2.6em;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nav-item:hover{transform:translateY(-2px) scale(1.03);background:rgba(255,255,255,.38);box-shadow:var(--sh3);color:var(--t1)}
.nav-item:hover .ico{transform:scale(1.08)}
.nav-item:active{transform:scale(.96)}
.nav-item.active{color:var(--lav2);font-weight:700;background:transparent;box-shadow:none;border-color:transparent}
.nav-item.active .ico{background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;box-shadow:0 5px 16px rgba(126,117,158,.35);transform:scale(1.08)}
.nav-item.active .lbl{font-weight:700}
.nav-item.add-module{
  background:transparent;border:2px dashed var(--bd);color:var(--t3);box-shadow:none;
  min-height:60px
}
.nav-item.add-module .ico{font-size:22px}
.nav-item.add-module:hover{background:rgba(255,255,255,.35);border-color:var(--lav3);color:var(--lav2);transform:translateY(-2px) scale(1.03)}
.nav-spacer{flex:1;min-height:8px}
.nav-lock{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--t3);
  border-radius:var(--rs);cursor:pointer;transition:all var(--tw)
}
.nav-lock:hover{background:rgba(255,255,255,.6);color:var(--t2);transform:scale(1.03)}

/* ====== Content Area ====== */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd2);flex-shrink:0}
#menuBtn{font-size:24px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--rs);color:var(--t2);background:rgba(255,255,255,.5);transition:all var(--tw)}
#menuBtn:hover{background:#fff;transform:scale(1.08);box-shadow:var(--sh3)}
#menuBtn:active{transform:scale(.92)}
#pageTitle{font-size:18px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
#page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:4px}

/* ====== Mobile overlay ====== */
#overlay{position:fixed;inset:0;background:rgba(45,40,60,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:99;opacity:0;pointer-events:none;transition:opacity var(--tw)}

/* ====== Cards & Sections ====== */
.sec{padding:18px}
.card{background:rgba(255,255,255,.62);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px;border:1px solid rgba(255,255,255,.5);transition:all var(--tw)}
.card:hover{box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.card-title{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:16px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.card-title .ico{font-size:22px;line-height:1;vertical-align:middle}
.card-sub{font-size:12.5px;color:var(--t3);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ====== Dashboard ====== */
.dash-hero{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.45);border-radius:var(--rl);padding:26px 22px;text-align:center;box-shadow:var(--sh);margin-bottom:16px;transition:all var(--tw)}
.dash-hero:hover{box-shadow:var(--sh2);background:rgba(255,255,255,.68)}
.dash-time{font-size:34px;font-weight:800;color:var(--t1);letter-spacing:-1px}
.dash-date{font-size:13.5px;color:var(--t2);margin-top:3px;font-weight:600}
.dash-quote{margin-top:20px;padding:18px;background:rgba(246,244,251,.7);border-radius:var(--r);border:1px solid rgba(255,255,255,.45)}
.dash-quote .qz{font-size:15px;color:var(--t1);font-weight:600;line-height:1.75}
.dash-quote .qen{font-size:12.5px;color:var(--t3);margin-top:8px;font-style:italic;font-weight:500}
.stat-card{background:rgba(255,255,255,.62);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:all var(--tw);cursor:pointer;border:1px solid rgba(255,255,255,.5)}
.stat-card:hover{transform:translateY(-4px) scale(1.03);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.stat-card:active{transform:scale(.97)}
.stat-card .stat-ico{font-size:30px;margin-bottom:10px;transition:transform var(--tw)}
.stat-card:hover .stat-ico{transform:scale(1.15)}
.stat-card .stat-label{font-size:12.5px;color:var(--t2);font-weight:600}
.stat-card .stat-val{font-size:24px;font-weight:800;color:var(--t1);margin-top:3px;letter-spacing:-.5px}
/* ====== Dashboard v3 ====== */
/* 顶部两栏：每日一句 + 日历卡片 */
.dash-top{display:grid;grid-template-columns:1fr 220px;gap:12px;margin-bottom:14px;align-items:stretch}
/* 每日一句 */
.quote-card{position:relative;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.5);
  border-radius:var(--rl);padding:26px 24px 20px;box-shadow:var(--sh);
  display:flex;flex-direction:column;transition:all var(--tw);overflow:hidden}
.quote-card:hover{box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.quote-deco{position:absolute;top:8px;left:18px;font-size:62px;line-height:1;color:var(--bd2);opacity:.55;font-family:Georgia,serif;font-weight:700;pointer-events:none}
.quote-en{font-size:20px;font-weight:800;line-height:1.55;color:var(--t1);letter-spacing:-.2px;margin-top:18px;font-style:italic}
.quote-zh{font-size:13.5px;color:var(--t2);font-weight:500;margin-top:10px;line-height:1.7}
.quote-actions{display:flex;gap:8px;margin-top:18px}
.quote-actions button{flex:1;height:38px;border-radius:var(--rs);background:var(--card2);border:1.5px solid var(--bd);font-size:12px;font-weight:700;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:4px;transition:all var(--tw);cursor:pointer}
.quote-actions button:hover{transform:translateY(-2px) scale(1.03);background:#fff;border-color:var(--lav);color:var(--t1);box-shadow:var(--sh3)}
.quote-actions button:active{transform:scale(.96)}
/* 日历卡片（点击展开月历） */
.cal-card{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.5);
  border-radius:var(--rl);padding:18px 16px 16px;box-shadow:var(--sh);text-align:center;transition:all var(--tw);cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.cal-card:hover{box-shadow:var(--sh2);background:rgba(255,255,255,.72);transform:translateY(-2px) scale(1.01)}
.cal-card:active{transform:scale(.98)}
.cal-card::before{content:'';position:absolute;top:-26px;right:-26px;width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--lav3),rgba(255,255,255,.25));opacity:.45}
.cal-hero{font-size:30px;font-weight:800;color:var(--t1);line-height:1;z-index:1;letter-spacing:-1px}
.cal-week{font-size:13px;color:var(--t2);font-weight:600;z-index:1}
.cal-time{font-size:12px;color:var(--t3);font-weight:700;background:var(--card2);padding:3px 10px;border-radius:12px;z-index:1;opacity:.85}
.cal-hint{font-size:10.5px;color:var(--t3);margin-top:2px;z-index:1;font-weight:600}
/* 日历弹窗 */
#calModal{position:fixed;inset:0;background:rgba(45,40,60,.32);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:1200;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
#calModal.show{display:flex;opacity:1}
.cal-modal-card{background:#fff;border-radius:var(--rxl);padding:22px;width:92%;max-width:420px;box-shadow:var(--sh2);transform:scale(.92);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
#calModal.show .cal-modal-card{transform:scale(1)}
.cal-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:var(--t1)}
.cal-title select{height:32px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--card2);font-size:14px;font-weight:700;color:var(--t1);padding:0 8px}
.cal-nav{width:34px;height:34px;border-radius:50%;border:none;background:var(--card2);color:var(--t1);font-size:20px;font-weight:700;cursor:pointer;transition:all var(--tw);display:flex;align-items:center;justify-content:center}
.cal-nav:hover{background:var(--lav);color:#fff;transform:scale(1.08)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-weekdays span{text-align:center;font-size:11px;font-weight:700;color:var(--t3)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s;position:relative;background:var(--card2)}
.cal-day:hover{background:var(--bd2);transform:scale(1.08)}
.cal-day.other{color:var(--t4);background:transparent}
.cal-day.today{background:var(--lav);color:#fff;box-shadow:0 4px 10px rgba(155,148,184,.35)}
.cal-day.selected{background:var(--t1);color:#fff}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:3px}
.cal-today-btn{width:100%;height:44px;margin-top:14px;border-radius:var(--rs);border:none;background:var(--t1);color:#fff;font-size:14px;font-weight:700;transition:all var(--tw);cursor:pointer}
.cal-today-btn:hover{transform:scale(1.02);box-shadow:0 6px 16px rgba(51,46,68,.18)}
/* 日历+时钟 单行紧凑条（深紫渐变，强化对比） */
.cal-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(120deg,#6E6390 0%,#8B82AE 100%);
  border-radius:var(--rl);padding:14px 20px;margin-bottom:14px;
  box-shadow:0 8px 22px rgba(110,99,144,.30);
  cursor:pointer;transition:all var(--tw);position:relative;overflow:hidden;
}
.cal-bar:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(110,99,144,.4)}
.cal-bar:active{transform:scale(.99)}
.cal-bar::after{content:'';position:absolute;right:-20px;top:-24px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12)}
.cal-bar-left{display:flex;align-items:baseline;gap:10px;z-index:1}
.cal-bar-date{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1}
.cal-bar-week{font-size:13px;font-weight:600;color:rgba(255,255,255,.82)}
.cal-bar-right{display:flex;align-items:center;gap:12px;z-index:1}
.cal-bar-clock{font-size:17px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1}
.cal-bar-go{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.22);padding:5px 13px;border-radius:13px;white-space:nowrap}
/* 日日是好日 */
.hhd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hhd-count{font-size:12.5px;color:var(--t2);font-weight:600}
.hhd-count b{color:var(--sage);font-size:19px;font-weight:800}
.hhd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* 横向布局：左侧圆形图标 + 右侧主区域；用 grid + 断点控制三端适配（文字 word-break 多行保护避免截断） */
.hhd-item{position:relative;background:rgba(246,244,251,.6);border:1.5px solid rgba(0,0,0,.06);
  border-radius:var(--rs);padding:12px 40px 12px 12px;text-align:left;cursor:pointer;transition:all var(--tw);
  display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:12px;min-height:80px;overflow:hidden}
.hhd-item:hover{transform:translateY(-3px);background:#fff;box-shadow:var(--sh3);border-color:var(--bd)}
.hhd-item:active{transform:scale(.97)}
/* 左侧固定圆形容器（避免 emoji 字体高度溢出） */
.hhd-ico-wrap{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);line-height:1}
.hhd-ico{font-size:22px;line-height:1;transition:transform var(--tw)}
.hhd-item:hover .hhd-ico{transform:scale(1.12)}
/* 右侧主区域 */
.hhd-main{min-width:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.hhd-name{font-size:12.5px;font-weight:700;color:var(--t1);line-height:1.3;word-break:break-word;overflow-wrap:anywhere}
.hhd-sub{font-size:10.5px;color:var(--t3);font-weight:600;line-height:1.3;word-break:break-word;overflow-wrap:anywhere}
.hhd-item.done .hhd-sub{color:var(--sage)}
.hhd-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.hhd-leg{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.55);padding:5px 10px;border-radius:999px}
.hhd-leg i{width:10px;height:10px;border-radius:50%}
/* HHD 打卡勾选圈（直接打卡 / 取消） */
.hhd-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  border:2px solid var(--t4);background:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all var(--tw);cursor:pointer;z-index:2}
.hhd-check:hover{transform:scale(1.15);border-color:var(--sage)}
.hhd-item.done .hhd-check{background:var(--sage);border-color:var(--sage)}
.hhd-item.done .hhd-check::after{content:'✓'}
/* 复盘卡片（可点击打卡 / 跳转）：单一统一模块，主紫莫兰迪色系淡彩背景 */
.review-card{
  cursor:pointer;transition:all var(--tw);position:relative;
  background:var(--card3);
  background:linear-gradient(135deg, color-mix(in srgb, var(--lav) 13%, #fff), color-mix(in srgb, var(--lav2) 17%, #fff));
}
.review-card:hover{box-shadow:var(--sh2);background:var(--card2)}
.review-card.done{border-color:rgba(127,179,138,.4)}
/* 复盘卡片：单一行内（图标 + 标题 + 状态 + 累计天数），不再切分多行 */
.rev-single{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:28px}
.rev-title{font-weight:800;font-size:15px;color:var(--t1)}
.rev-status{font-size:11px;color:var(--t2);font-weight:600}
.rev-total{margin-left:auto;font-size:13px;color:var(--t2);font-weight:700;display:flex;align-items:center;gap:6px}
.rev-total b{color:var(--lav2);font-size:18px;font-weight:800}
.hhd-head{cursor:pointer;transition:all var(--tw)}
.hhd-head:hover .card-sub{color:var(--lav2)}
/* HHD 详情页 */
.hhd-detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hhd-detail-head .back{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t2);cursor:pointer;transition:all var(--tw)}
.hhd-detail-head .back:hover{background:var(--bd2);transform:scale(1.08)}
.hhd-detail-head .ico{font-size:32px}
.hhd-detail-head .txt{flex:1}
.hhd-detail-head .name{font-size:18px;font-weight:800;color:var(--t1)}
.hhd-detail-head .streak{font-size:12px;color:var(--t3);font-weight:600}
.hhd-detail-cal .cal-day{cursor:pointer}
.hhd-detail-cal .cal-day.done{background:rgba(127,179,138,.18);color:var(--sage);border:1.5px solid rgba(127,179,138,.35)}
.hhd-detail-cal .cal-day.done:hover{background:rgba(127,179,138,.28)}

/* ====== Todo List ====== */
.todo-cat{background:rgba(255,255,255,.62);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid rgba(255,255,255,.5)}
.todo-cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.todo-cat-title{font-size:15px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
.todo-cat-title .dot{width:9px;height:9px;border-radius:50%}
.todo-add-row{display:flex;gap:10px;margin-bottom:10px}
.todo-add-row input{flex:1;height:42px;background:var(--input);border-radius:var(--rs);padding:0 14px;border:1.5px solid var(--bd);font-weight:500;transition:all .2s}
.todo-add-row input:focus{border-color:var(--lav);background:#fff}
.todo-add-row select{height:42px;background:var(--input);border-radius:var(--rs);padding:0 10px;border:1.5px solid var(--bd);font-size:13px;color:var(--t2);font-weight:500}
.todo-add-btn{width:42px;height:42px;background:var(--t1);color:#fff;border-radius:var(--rs);font-size:20px;display:flex;align-items:center;justify-content:center;transition:all var(--tw);box-shadow:0 4px 12px rgba(51,46,68,.15)}
.todo-add-btn:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(51,46,68,.22)}
.todo-add-btn:active{transform:scale(.92)}
.todo-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--bd2)}
.todo-item:last-child{border-bottom:none}
.todo-check{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--t4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px;color:#fff;cursor:pointer}
.todo-check.done{background:var(--sage);border-color:var(--sage)}
.todo-check.done::after{content:'✓'}
.todo-text{flex:1;font-size:15px;color:var(--t1);transition:all .2s;word-break:break-word;font-weight:500}
.todo-text.done{text-decoration:line-through;color:var(--t3)}
.todo-pri{font-size:10.5px;padding:3px 8px;border-radius:6px;flex-shrink:0;font-weight:700}
.todo-pri.high{background:#F5E3E7;color:var(--rose)}
.todo-pri.mid{background:#EDE8F4;color:var(--taupe)}
.todo-pri.low{background:#E5EBF2;color:var(--blue)}
.todo-del{font-size:17px;color:var(--t4);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:all .2s}
.todo-del:hover{background:var(--card3);color:var(--rose);transform:scale(1.1)}

/* ====== 今日计划 / Today Plan ====== */
.today-sec{display:flex;flex-direction:column;width:100%;min-width:0;height:100%;min-height:100%;margin-top:-4px;padding:0 8px;box-sizing:border-box}
.tp-top{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;background:linear-gradient(180deg,var(--bg) 65%,rgba(251,250,253,0));margin-bottom:4px}
.tp-date-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tp-date-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border:1.5px solid var(--bd2);border-radius:var(--rs);padding:10px 4px;cursor:pointer;transition:all var(--tw);position:relative}
.tp-date-cell:hover{transform:translateY(-2px);box-shadow:var(--sh3);border-color:var(--lav3)}
.tp-date-cell.today{background:linear-gradient(135deg,var(--lav2),var(--lav));border-color:transparent;color:#fff;box-shadow:0 5px 14px rgba(126,117,158,.35)}
.tp-date-cell.selected{outline:2.5px solid var(--lav2);outline-offset:-2.5px}
.tp-date-w{font-size:11px;font-weight:600;color:var(--t3);transition:color .2s}
.tp-date-cell.today .tp-date-w{color:rgba(255,255,255,.85)}
.tp-date-n{font-size:16px;font-weight:800;line-height:1;transition:color .2s}
.tp-date-cell.today .tp-date-n{color:#fff}
.tp-date-dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
.tp-date-dot.has{background:var(--gold)}
.tp-date-dot.all{background:var(--sage)}
.tp-tab-row{display:flex;align-items:center;gap:0}
.tp-tabs{display:flex;gap:8px;flex:1;overflow-x:auto}
.tp-tab{flex:1;text-align:center;padding:10px 8px;border-radius:999px;font-size:14px;font-weight:700;color:var(--t3);background:var(--card3);cursor:pointer;transition:all var(--tw);white-space:nowrap}
.tp-tab.active{background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;box-shadow:0 4px 12px rgba(126,117,158,.3)}
.tp-cal-inline{max-height:0;overflow:hidden;opacity:0;transition:max-height .28s ease,opacity .22s,padding .28s ease,margin .28s ease;background:var(--card);border-radius:var(--r);padding:0 14px;margin-bottom:0;box-shadow:none}
.tp-cal-inline.open{max-height:300px;opacity:1;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.tp-cal-inline .tp-cal-top{margin-bottom:6px}
.tp-cal-inline .tp-cal-top .tp-cal-title{font-size:13px;font-weight:700}
.tp-cal-inline .tp-cal-top .tp-cal-nav{width:24px;height:24px;font-size:14px}
.tp-cal-inline .tp-cal-week{margin-bottom:3px;font-size:10.5px;color:var(--t3)}
.tp-cal-inline .tp-cal-days{gap:3px;grid-template-columns:repeat(7,1fr)}
.tp-cal-inline .tp-cal-day{border-radius:8px;font-size:11px;padding:0;aspect-ratio:1.4/1;display:flex;align-items:center;justify-content:center;min-height:30px;max-height:36px}
.tp-list-head{font-size:13px;font-weight:700;color:var(--t2);margin:2px 2px 4px}
.tp-list{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 76px 0;align-content:start}
.tp-cat{background:var(--card);border-radius:var(--r);padding:9px 12px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.06);border-left:4px solid var(--lav);min-width:0}
.tp-cat-head{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:var(--t1);margin-bottom:6px}
.tp-cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tp-cat-count{margin-left:auto;font-size:12px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.55);padding:2px 10px;border-radius:999px}
.tp-progress{display:flex;align-items:center;gap:12px;margin:10px 0 14px;background:var(--card);border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.06);grid-column:1/-1}
.tp-progress-bar{flex:1;height:8px;background:rgba(126,117,158,.18);border-radius:999px;overflow:hidden}
.tp-progress-fill{height:100%;background:linear-gradient(90deg,var(--lav2),var(--lav));border-radius:999px;transition:width .3s}
.tp-progress-num{font-size:12px;font-weight:700;color:var(--t2);white-space:nowrap}
.tp-parent .tp-title{font-weight:600}
.tp-paren-badge{font-size:11px;font-weight:700;color:var(--t2);background:rgba(126,117,158,.12);border-radius:999px;padding:1px 8px;margin-right:6px}
.tp-item .tp-done-at{font-size:11px;color:var(--t3);margin-left:6px}
.tp-sub-item{display:flex;align-items:center;gap:10px;padding:2px 0 2px 30px;border-bottom:1px dashed rgba(0,0,0,.07);cursor:pointer;min-width:0}
.tp-sub-item:last-child{border-bottom:none}
.tp-sub-item .tp-check{width:17px;height:17px;font-size:11px}
.tp-sub-item.done .tp-title{text-decoration:line-through;color:var(--t3)}
.tp-sub-item .tp-main{display:flex;flex-direction:column;gap:2px}
.tp-sub-item .tp-done-at{font-size:11px;color:var(--t3)}
.tp-item{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1.5px solid rgba(0,0,0,.08);cursor:pointer;transition:background .15s}
.tp-item:last-child{border-bottom:none}
.tp-item:hover{background:rgba(255,255,255,.45)}
.tp-check-wrap{padding:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tp-check{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--t4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;transition:transform .12s ease,background .12s ease,border-color .12s ease;pointer-events:none}
.tp-check.done{background:var(--sage);border-color:var(--sage)}
.tp-check-wrap:active .tp-check{transform:scale(.82)}
.tp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tp-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.tp-title{font-size:15px;font-weight:600;color:var(--t1);word-break:break-word;transition:all .2s;flex:1;min-width:0}
.tp-item.done .tp-title{text-decoration:line-through;color:var(--t3)}
.tp-desc{font-size:12.5px;color:var(--t3);margin-top:2px;word-break:break-word}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px}
.tp-pri{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:700}
.tp-pri.high{background:#F5E3E7;color:var(--rose)}
.tp-pri.mid{background:#EDE8F4;color:var(--taupe)}
.tp-rep{font-size:10.5px;padding:2px 8px;border-radius:6px;background:#E5EBF2;color:var(--blue);font-weight:700}
.tp-time{flex-shrink:0;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.7);color:var(--t2);font-weight:700}
.tp-del{font-size:16px;color:var(--t4);width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all .2s}
.tp-del:hover{background:rgba(255,255,255,.55);color:var(--rose)}
.tp-del:active{transform:scale(.85);color:var(--rose)}
.tp-empty{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--t3);padding:20px;font-size:15px;line-height:2;width:100%}
.tp-empty span{font-size:13px;opacity:.8}

/* 待处理区：过期未完成事项（按需顺延） */
.od-card{padding:10px 12px;margin-bottom:10px;flex:0 0 auto}
.od-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1.5px dashed rgba(0,0,0,.07)}
.od-row:last-child{border-bottom:none}
.od-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.od-title{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--rose);word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.od-date{font-size:10.5px;color:var(--t3);font-weight:600}
.od-carry{flex-shrink:0;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:#F5E3E7;color:var(--rose);transition:all .2s;cursor:pointer;min-height:28px}
.od-carry:hover{transform:scale(1.05);background:#F0D6DC}
.od-carry.on{background:var(--sage);color:#fff}
.od-del{font-size:15px;color:var(--t4);width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:all .2s}
.od-del:hover{background:var(--card3);color:var(--rose)}

/* FAB */
.tp-fab{position:fixed;right:20px;bottom:26px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(126,117,158,.45);z-index:30;transition:all var(--tw)}
.tp-fab:active{transform:scale(.9)}

/* 新增/编辑 浮层：body 级挂载，必须高于 sidebar (z-index:100) 与顶部栏 (z-index:120) */
.tp-modal{position:fixed;inset:0;background:rgba(45,40,60,.32);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:9999;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;padding:18px}
.tp-modal.show{display:flex;opacity:1}
.tp-modal-card{width:100%;max-width:440px;background:var(--card);border-radius:var(--rxl);padding:18px;box-shadow:var(--sh2);transform:scale(.96);transition:transform .25s;box-sizing:border-box}
.tp-modal.show .tp-modal-card{transform:scale(1)}
.tp-modal-head{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:800;color:var(--t1);margin-bottom:12px}
.tp-x{width:32px;height:32px;border-radius:10px;background:var(--card3);color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tp-x:hover{background:var(--bd);color:var(--t1)}
.tp-field{margin-bottom:10px}
.tp-field label{display:block;font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:4px}
.tp-field input,.tp-field textarea{width:100%;background:var(--input);border-radius:var(--rs);padding:10px 12px;border:1.5px solid var(--bd);font-weight:500;transition:all .2s;resize:none}
.tp-field input:focus,.tp-field textarea:focus{border-color:var(--lav);background:#fff;box-shadow:0 0 0 4px rgba(155,148,184,.12)}
.tp-section{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px}
.tp-section-title{font-size:12px;font-weight:800;color:var(--t2);margin-bottom:6px}
.tp-switch-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd2);cursor:pointer}
.tp-switch-row:last-child{border-bottom:none}
.tp-switch-icon{font-size:17px;width:22px;text-align:center;line-height:1}
.tp-switch-label{flex:1;font-size:14px;font-weight:600;color:var(--t1)}
.tp-switch{-webkit-appearance:none;appearance:none;width:44px;height:26px;background:var(--bd);border-radius:999px;position:relative;outline:none;cursor:pointer;transition:background .2s;flex-shrink:0}
.tp-switch:checked{background:var(--lav)}
.tp-switch::after{content:'';position:absolute;left:2px;top:2px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s}
.tp-switch:checked::after{transform:translateX(18px)}
.tp-switch-panel{display:none;padding:4px 0 8px 32px}
.tp-switch-panel input{width:100%;background:var(--input);border-radius:var(--rs);padding:9px 12px;border:1.5px solid var(--bd);font-weight:500}
.tp-pills{display:flex;flex-wrap:wrap;gap:6px}
.tp-pill{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--t2);background:var(--card3);cursor:pointer;transition:all .2s}
.tp-pill.active{background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;box-shadow:0 3px 10px rgba(126,117,158,.3)}
.tp-modal-foot{display:flex;gap:10px;margin-top:8px}
.tp-cancel{flex:1;height:42px;border-radius:var(--rs);background:var(--card3);color:var(--t2);font-size:14.5px;font-weight:700;transition:all .2s}
.tp-cancel:hover{background:var(--bd)}
.tp-save{flex:1;height:42px;border-radius:var(--rs);background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;font-size:14.5px;font-weight:800;box-shadow:0 5px 16px rgba(126,117,158,.35);transition:all .2s}
.tp-save:active{transform:scale(.97)}

/* 月历总览浮层：body 级挂载，必须高于 sidebar */
.tp-cal-modal{position:fixed;inset:0;background:rgba(45,40,60,.32);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:9999;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;padding:18px}
.tp-cal-modal.show{display:flex;opacity:1}
.tp-cal-card{width:100%;max-width:420px;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:var(--rxl);padding:20px;box-shadow:var(--sh2);transform:scale(.96);transition:transform .25s}
.tp-cal-modal.show .tp-cal-card{transform:scale(1)}
.tp-cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tp-cal-title{font-size:17px;font-weight:800;color:var(--t1)}
.tp-cal-nav{width:36px;height:36px;border-radius:12px;background:var(--card3);color:var(--t1);font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tp-cal-nav:active{transform:scale(.9);background:var(--bd)}
.tp-cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.tp-cal-week span{text-align:center;font-size:11px;color:var(--t3);font-weight:700}
.tp-cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tp-cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s;position:relative;background:var(--card2)}
.tp-cal-day:hover{background:var(--bd2)}
.tp-cal-day.other{color:var(--t4);background:transparent}
.tp-cal-day.today{background:var(--lav);color:#fff;box-shadow:0 4px 10px rgba(155,148,184,.35)}
.tp-cal-day.selected{outline:2.5px solid var(--lav2);outline-offset:-2.5px}
.tp-cal-dot{position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%}
.tp-cal-dot.all{background:var(--sage)}
.tp-cal-dot.part{background:var(--gold)}
.tp-cal-dot.none{background:var(--t4)}
.tp-cal-detail{margin-top:14px;border-top:1.5px solid var(--bd2);padding-top:12px;max-height:34vh;overflow-y:auto}
.tp-cal-detail-head{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px}
.tp-cal-empty{font-size:13px;color:var(--t3);text-align:center;padding:14px 0}
.tp-cal-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--card2);margin-bottom:7px;cursor:pointer;transition:all .15s}
.tp-cal-item:hover{background:var(--bd2)}
.tp-cal-item.done .tp-title{text-decoration:line-through;color:var(--t3)}
.tp-cal-item-t{flex:1;min-width:0}

/* ====== 30-Day Checkin Grid ====== */
.checkin-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:14px 0}
.checkin-block{aspect-ratio:1;border-radius:var(--rs);background:var(--bd2);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--t3);cursor:pointer;transition:all var(--tw);position:relative;font-weight:600}
.checkin-block:hover{transform:scale(1.08);background:var(--bd)}
.checkin-block.active{background:var(--sage);color:#fff;transform:scale(1.08);box-shadow:0 4px 12px rgba(127,179,138,.3)}
.checkin-block.active::after{content:'✓';position:absolute;font-size:17px}
.checkin-block .day-num{font-size:11.5px;opacity:.65}
.checkin-block.active .day-num{display:none}
.checkin-progress{text-align:center;font-size:13.5px;color:var(--t2);padding:10px 0;font-weight:500}
.checkin-progress b{color:var(--sage);font-size:20px}

/* ====== Theme Tabs ====== */
.theme-tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.theme-tabs::-webkit-scrollbar{display:none}
.theme-tab{padding:9px 18px;border-radius:22px;background:rgba(255,255,255,.62);font-size:13.5px;color:var(--t2);white-space:nowrap;box-shadow:var(--sh);cursor:pointer;transition:all var(--tw);flex-shrink:0;font-weight:600;border:1px solid rgba(255,255,255,.5)}
.theme-tab:hover{transform:scale(1.06);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.theme-tab.active{background:var(--t1);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(51,46,68,.18)}
.theme-tab-add{padding:9px 16px;border-radius:22px;background:rgba(246,244,251,.55);font-size:13.5px;color:var(--t2);border:2px dashed var(--bd);cursor:pointer;flex-shrink:0;transition:all var(--tw);font-weight:600}
.theme-tab-add:hover{background:rgba(255,255,255,.72);border-color:var(--lav3);transform:scale(1.05)}

/* ====== Forms ====== */
.f-label{font-size:13.5px;font-weight:700;color:var(--t2);margin-bottom:7px;margin-top:16px}
.f-label:first-child{margin-top:0}
.f-input{width:100%;height:44px;background:var(--input);border-radius:var(--rs);padding:0 16px;border:1.5px solid var(--bd);font-weight:500;transition:all .2s}
.f-input:focus{border-color:var(--lav);background:#fff}
.f-area{width:100%;min-height:130px;background:var(--input);border-radius:var(--rs);padding:14px 16px;border:1.5px solid var(--bd);resize:vertical;line-height:1.75;font-weight:500;transition:all .2s}
.f-area:focus{border-color:var(--lav);background:#fff}
.btn{padding:11px 22px;border-radius:var(--rs);font-size:14.5px;font-weight:700;transition:all var(--tw)}
.btn:hover{transform:scale(1.05)}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--t1);color:#fff;box-shadow:0 6px 16px rgba(51,46,68,.16)}
.btn-primary:hover{box-shadow:0 8px 22px rgba(51,46,68,.22)}
.btn-save{width:100%;height:48px;background:var(--t1);color:#fff;border-radius:var(--rs);font-size:16px;font-weight:700;margin-top:16px;transition:all var(--tw);box-shadow:0 6px 18px rgba(51,46,68,.16)}
.btn-save:hover{transform:scale(1.02);box-shadow:0 8px 24px rgba(51,46,68,.22)}
.btn-save:active{transform:scale(.98)}

/* ====== Q&A ====== */
.qa-item{background:rgba(255,255,255,.62);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:1px solid rgba(255,255,255,.5)}
.qa-q{font-size:15px;font-weight:700;color:var(--t1);cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.qa-q .q-toggle{color:var(--t3);font-size:13px;flex-shrink:0;margin-top:2px;transition:transform .2s}
.qa-q.open .q-toggle{transform:rotate(90deg)}
.qa-answers{display:none;margin-top:12px;padding-left:4px}
.qa-answers.show{display:block}
.qa-answer{padding:10px 14px;background:var(--card2);border-radius:var(--rs);font-size:13.5px;color:var(--t1);margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;font-weight:500}
.qa-answer .a-mark{color:var(--sage);font-weight:800;flex-shrink:0}
.qa-add-row{display:flex;gap:10px;margin-top:10px}
.qa-add-row input{flex:1;height:38px;background:var(--input);border-radius:var(--rs);padding:0 12px;border:1.5px solid var(--bd);font-weight:500}
.qa-add-row input:focus{border-color:var(--lav);background:#fff}

/* ====== Table ====== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.data-tbl th{background:var(--card2);color:var(--t2);font-weight:700;padding:12px 10px;text-align:left;border-bottom:2px solid var(--bd);white-space:nowrap;font-size:12.5px}
table.data-tbl td{padding:12px 10px;border-bottom:1.5px solid var(--bd2);color:var(--t1);white-space:nowrap;font-weight:500}
table.data-tbl tr:last-child td{border-bottom:none}

/* ====== Wellness ====== */
.wellness-item{background:rgba(255,255,255,.62);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.5);transition:all var(--tw)}
.wellness-item:hover{transform:translateY(-2px);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.wellness-item .w-ico{font-size:26px;flex-shrink:0}
.wellness-item .w-text{flex:1}
.wellness-item .w-title{font-size:15px;font-weight:700;color:var(--t1)}
.wellness-item .w-desc{font-size:12.5px;color:var(--t2);margin-top:3px;font-weight:500}
.wellness-check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--t4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px;color:#fff;cursor:pointer}
.wellness-check.done{background:var(--mint);border-color:var(--mint)}
.wellness-check.done::after{content:'✓'}

/* ====== Travel ====== */
.travel-item{background:rgba(255,255,255,.62);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.5);transition:all var(--tw)}
.travel-item:hover{transform:translateY(-2px);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.travel-check{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--t4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px;color:#fff;cursor:pointer}
.travel-check.done{background:var(--blue);border-color:var(--blue)}
.travel-check.done::after{content:'✓'}
.travel-info{flex:1}
.travel-place{font-size:15px;font-weight:700;color:var(--t1);transition:all .2s}
.travel-place.done{text-decoration:line-through;color:var(--t3)}
.travel-date{font-size:12.5px;color:var(--t2);margin-top:3px;font-weight:500}

/* ====== Diary/Review ====== */
.diary-entry{background:rgba(255,255,255,.62);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:1px solid rgba(255,255,255,.5);transition:all var(--tw);cursor:pointer}
.diary-entry:hover{transform:translateY(-2px);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.diary-date{font-size:13.5px;font-weight:700;color:var(--blue);margin-bottom:7px}
.diary-content{font-size:15px;color:var(--t1);white-space:pre-wrap;line-height:1.75;font-weight:500}
.review-sec{margin-bottom:16px}
.review-label{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.review-label .ico{font-size:17px}

/* ====== Media Plan ====== */
.media-tabs{display:flex;gap:10px;margin-bottom:16px}
.media-tab{padding:9px 18px;border-radius:22px;background:rgba(255,255,255,.62);font-size:13.5px;color:var(--t2);cursor:pointer;transition:all var(--tw);font-weight:600;border:1px solid rgba(255,255,255,.5);box-shadow:var(--sh3)}
.media-tab:hover{transform:scale(1.05);background:rgba(255,255,255,.72)}
.media-tab.active{background:var(--lav);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(155,148,184,.35)}
.inspo-item{background:rgba(255,255,255,.62);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:1px solid rgba(255,255,255,.5);transition:all var(--tw)}
.inspo-item:hover{transform:translateY(-2px);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.inspo-item .inspo-date{font-size:12.5px;color:var(--t3);margin-bottom:7px;font-weight:600}
.inspo-item .inspo-title{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:5px}
.inspo-item .inspo-body{font-size:13.5px;color:var(--t2);line-height:1.75;font-weight:500}

/* ====== AI Skills ====== */
.prompt-card{background:rgba(255,255,255,.62);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid rgba(255,255,255,.5);transition:all var(--tw)}
.prompt-card:hover{transform:translateY(-2px);box-shadow:var(--sh2);background:rgba(255,255,255,.72)}
.prompt-card .pc-title{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.prompt-card .pc-body{background:var(--card2);border-radius:var(--rs);padding:14px;font-size:13.5px;color:var(--t1);line-height:1.75;border:1px solid var(--bd2);font-weight:500}
.prompt-card .pc-copy{margin-top:10px;font-size:12.5px;color:var(--blue);cursor:pointer;font-weight:700;transition:all .2s;display:inline-block}
.prompt-card .pc-copy:hover{transform:scale(1.05);color:var(--lav2)}
.four-elem{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.four-elem .fe-item{background:var(--card2);border-radius:var(--r);padding:14px;text-align:center;transition:all var(--tw)}
.four-elem .fe-item:hover{transform:translateY(-3px) scale(1.03);background:#fff;box-shadow:var(--sh3)}
.four-elem .fe-icon{font-size:30px;margin-bottom:4px;transition:transform var(--tw)}
.four-elem .fe-item:hover .fe-icon{transform:scale(1.15)}
.four-elem .fe-name{font-size:14px;font-weight:700;color:var(--t1);margin-top:5px}
.four-elem .fe-desc{font-size:11.5px;color:var(--t2);margin-top:3px;font-weight:500}

/* ====== Word Dictionary ====== */
.dict-add-row{display:grid;grid-template-columns:1.2fr 1.5fr 2fr 1fr auto;gap:8px;margin-bottom:12px}
.dict-add-row input,.dict-add-row select{height:38px;background:var(--input);border-radius:var(--rs);padding:0 10px;border:1.5px solid var(--bd);font-size:12.5px;font-weight:500}
.dict-add-row input:focus,.dict-add-row select:focus{border-color:var(--lav);background:#fff}
.dict-add-btn{height:38px;width:38px;background:var(--t1);color:#fff;border-radius:var(--rs);font-size:17px;display:flex;align-items:center;justify-content:center;transition:all var(--tw);box-shadow:0 4px 12px rgba(51,46,68,.15)}
.dict-add-btn:hover{transform:scale(1.08)}
.dict-add-btn:active{transform:scale(.92)}
.dict-export{margin-top:12px;text-align:center;font-size:13.5px;color:var(--blue);cursor:pointer;padding:10px;border:1.5px dashed var(--bd);border-radius:var(--rs);font-weight:600;transition:all var(--tw)}
.dict-export:hover{background:var(--card2);border-color:var(--lav3);transform:scale(1.02)}

/* ====== Daily Oral / Reading ====== */
.oral-card{background:var(--card2);border-radius:var(--rs);padding:16px;margin-bottom:12px;border:1.5px solid var(--bd2);transition:all var(--tw)}
.oral-card:last-child{margin-bottom:0}
.oral-head{margin-bottom:12px}
.oral-source{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.oral-src{font-size:12px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.6);padding:3px 10px;border-radius:8px}
.oral-scene{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--lav2),var(--lav));padding:3px 9px;border-radius:8px}
.oral-title{font-size:15px;font-weight:800;color:var(--t1);display:flex;align-items:center;gap:8px}
.oral-playing{font-size:13px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.oral-body{margin-bottom:14px}
.oral-hint{font-size:12px;color:var(--t3);font-weight:600;margin-bottom:10px;padding:8px 10px;background:rgba(255,255,255,.55);border-radius:10px}
.oral-en{font-size:15px;font-weight:700;color:var(--t1);line-height:1.7;margin-bottom:6px}
.oral-zh{font-size:13px;color:var(--t2);line-height:1.7}
.oral-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.oral-btn{height:40px;border-radius:var(--rs);background:#fff;border:1.5px solid var(--bd);font-size:13px;font-weight:700;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:4px;transition:all var(--tw);cursor:pointer}
.oral-btn:hover{transform:translateY(-2px);border-color:var(--lav);color:var(--t1);box-shadow:var(--sh3)}
.oral-btn:active{transform:scale(.96)}
.oral-btn.active{background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(126,117,158,.3)}
.oral-summary-card{animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.oral-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--t3);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.oral-close:hover{background:var(--bd);color:var(--t1)}
.oral-summary{display:flex;flex-direction:column;gap:14px}
.oral-sum-group{background:rgba(255,255,255,.55);border-radius:var(--rs);padding:14px}
.oral-sum-title{font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--lav2),var(--lav));display:inline-block;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.oral-sum-item{font-size:13px;color:var(--t2);margin-bottom:10px;line-height:1.6}
.oral-sum-item:last-child{margin-bottom:0}
.oral-sum-en{font-size:14px;font-weight:700;color:var(--t1);margin-top:5px}
.oral-sum-zh{font-size:12.5px;color:var(--t3);margin-top:2px}
.reading-card{background:rgba(255,255,255,.55);border-radius:var(--rs);padding:16px;border:1.5px solid var(--bd2)}
.reading-title{font-size:15px;font-weight:800;color:var(--t1);margin-bottom:10px}
.reading-en{font-size:14.5px;font-weight:600;color:var(--t1);line-height:1.8;margin-bottom:8px}
.reading-zh{font-size:13px;color:var(--t2);line-height:1.8}

/* ====== Misc ====== */
.empty-hint{text-align:center;padding:28px;color:var(--t3);font-size:14px;font-weight:500}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11.5px;font-weight:700}
.progress-bar{height:7px;background:var(--bd2);border-radius:4px;overflow:hidden;margin-top:10px}
.progress-bar-fill{height:100%;background:var(--sage);border-radius:4px;transition:width .3s}
.section-divider{height:1px;background:var(--bd);margin:18px 0}
.countdown{text-align:center;padding:18px;background:rgba(246,244,251,.65);border-radius:var(--r);margin:14px 0;border:1px solid rgba(255,255,255,.45)}
.countdown .cd-num{font-size:38px;font-weight:800;color:var(--coral);letter-spacing:-1px}
.countdown .cd-label{font-size:13.5px;color:var(--t2);margin-top:5px;font-weight:600}

/* ====== Add Module Modal ====== */
#moduleModal{position:fixed;inset:0;background:rgba(45,40,60,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
#moduleModal.show{display:flex;opacity:1}
.modal-card{background:#fff;border-radius:var(--rxl);padding:26px;width:88%;max-width:360px;box-shadow:var(--sh2);transform:scale(.92);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
#moduleModal.show .modal-card{transform:scale(1)}
.modal-title{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:18px;text-align:center}
.modal-row{margin-bottom:14px}
.modal-row label{display:block;font-size:13px;font-weight:700;color:var(--t2);margin-bottom:6px}
.modal-row input,.modal-row select{width:100%;height:44px;background:var(--input);border-radius:var(--rs);padding:0 14px;border:1.5px solid var(--bd);font-weight:500}
.modal-row input:focus,.modal-row select:focus{border-color:var(--lav);background:#fff}
.modal-btns{display:flex;gap:12px;margin-top:22px}
.modal-btns button{flex:1;height:46px;border-radius:var(--rs);font-size:15px;font-weight:700;transition:all var(--tw)}
.modal-btns .btn-cancel{background:var(--card2);color:var(--t2)}
.modal-btns .btn-cancel:hover{background:var(--bd2)}
.modal-btns .btn-confirm{background:var(--t1);color:#fff;box-shadow:0 6px 16px rgba(51,46,68,.16)}
.modal-btns .btn-confirm:hover{transform:scale(1.03);box-shadow:0 8px 22px rgba(51,46,68,.22)}

/* ====== Custom Module Page ====== */
.cm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cm-title{font-size:18px;font-weight:800;color:var(--t1);display:flex;align-items:center;gap:10px}
.cm-actions{display:flex;gap:8px}
.cm-actions button{padding:8px 14px;border-radius:var(--rs);font-size:12.5px;font-weight:700;background:var(--card2);color:var(--t2);transition:all var(--tw)}
.cm-actions button:hover{transform:scale(1.05);background:var(--bd2)}
.cm-actions button.danger{color:var(--rose)}
.cm-actions button.danger:hover{background:#F5E3E7}

  #menuBtn{display:none}

  .nav-lock{padding:5px;margin-top:3px;font-size:9px}
  .sec{padding:8px}
  .card{padding:12px;margin-bottom:8px;border-radius:18px}
  .card-title{font-size:15.5px;margin-bottom:8px;gap:8px}
  .card-title .ico{font-size:19px}
  .grid3{grid-template-columns:1fr 1fr;gap:8px}
  .grid2{gap:8px}
  .dash-hero{padding:18px 14px;margin-bottom:10px}
  .dash-time{font-size:26px}
  .dash-date{font-size:12px}
  .dash-quote{margin-top:14px;padding:13px}
  .dash-quote .qz{font-size:13.5px;line-height:1.65}
  .stat-card{padding:13px}
  .stat-card .stat-ico{font-size:24px;margin-bottom:6px}
  .stat-card .stat-val{font-size:20px}
  .stat-card .stat-label{font-size:11.5px}
  .dash-top{grid-template-columns:1fr;gap:8px;margin-bottom:10px}
  .cal-card{order:-1;padding:16px 14px 14px}
  .cal-card::before{width:70px;height:70px;top:-20px;right:-20px}
  .cal-hero{font-size:28px}
  .cal-week{font-size:12px}
  .cal-time{font-size:11px}
  .cal-hint{display:none}
  .quote-card{padding:18px 14px 16px}
  .quote-deco{font-size:46px;top:4px;left:12px}
  .quote-en{font-size:17px;line-height:1.55}
  .quote-zh{font-size:13.5px;margin-top:9px}
  .quote-actions{margin-top:14px}
  .quote-actions button{height:34px;font-size:11.5px}
  .cal-bar{padding:9px 12px;margin-bottom:8px;border-radius:16px}
  .cal-bar-date{font-size:17px}
  .cal-bar-week{font-size:10.5px}
  .cal-bar-clock{font-size:14px}
  .cal-bar-go{font-size:10px;padding:3px 9px}
  .rev-ico{font-size:19px}
  .rev-total{margin-top:0;font-size:11.5px;font-weight:700}
  .rev-total b{font-size:15px}
  /* 首页紧凑单屏：iPhone 17 等手机端 */
  .sec{padding:6px}
  .cal-bar{padding:7px 12px;margin-bottom:5px;border-radius:14px}
  .cal-bar-date{font-size:15px}
  .cal-bar-week{font-size:10px}
  .cal-bar-clock{font-size:13px}
  .cal-bar-go{font-size:9.5px;padding:3px 8px}
  .quote-card{padding:10px 12px 10px;margin-bottom:5px;border-radius:16px}
  .quote-deco{font-size:28px;top:2px;left:10px}
  .quote-en{font-size:13px;line-height:1.38;margin-top:8px}
  .quote-zh{font-size:11px;line-height:1.5;margin-top:4px}
  .quote-actions{margin-top:7px;gap:5px}
  .quote-actions button{height:27px;font-size:10.5px;border-radius:11px}

  .hhd-head{margin-bottom:5px}
  .hhd-head .card-title{margin-bottom:0}
  .hhd-count{font-size:11.5px}
  .hhd-count b{font-size:15px}
  .hhd-grid{grid-template-columns:repeat(4,1fr);gap:5px}
  .hhd-item{padding:5px 3px 4px;border-radius:11px}
  .hhd-ico{font-size:17px}
  .hhd-name{font-size:9.5px;margin-top:3px}
  .hhd-sub{font-size:8.5px;margin-top:1px}
  .hhd-check{top:3px;right:3px;width:16px;height:16px;font-size:8px;border-width:1.5px}
  .progress-bar{height:5px;margin-top:5px}
  .review-card{padding:8px 10px}
  .review-card .card-title{margin-bottom:2px;font-size:14px;gap:7px}
  .review-card .card-sub{font-size:10.5px}
  .review-card .hhd-check{top:8px;right:8px}
  .cal-modal-card{padding:18px 14px 16px}
  .cal-title{font-size:16px}
  .cal-day{font-size:12px;border-radius:10px}
  .hhd-grid{grid-template-columns:1fr;gap:8px}        /* 手机端单列紧凑布局 */
  .hhd-item{padding:12px 38px 12px 12px;border-radius:14px;grid-template-columns:36px minmax(0,1fr);gap:10px}
  .hhd-ico-wrap{width:36px;height:36px}
  .hhd-ico{font-size:20px;line-height:1}
  .hhd-name{font-size:12.5px;line-height:1.3}
  .hhd-sub{font-size:10.5px;line-height:1.3}
  .hhd-check{top:8px;right:8px;width:22px;height:22px;font-size:11px;border-width:2px}
  .hhd-detail-head .name{font-size:16px}
  .hhd-detail-head .ico{font-size:26px}
  .todo-cat{padding:13px;margin-bottom:10px}
  .qa-item{padding:13px;margin-bottom:9px}
  .wellness-item{padding:13px;margin-bottom:9px;gap:10px}
  .travel-item{padding:13px;margin-bottom:9px;gap:10px}
  .diary-entry{padding:13px;margin-bottom:9px}
  .prompt-card{padding:14px;margin-bottom:10px}
  .inspo-item{padding:13px;margin-bottom:9px}
  .dict-add-row{grid-template-columns:1fr 1fr;gap:8px}
  .dict-add-btn{grid-column:span 2}
  .checkin-grid{gap:7px;margin:10px 0}
  /* ===== 首页移动端铺满：仅 dashboard（.dash-sec）生效，2列×4行大卡片自动拉伸 ===== */
  .dash-sec{
    display:flex;
    flex-direction:column;
    height:100%;              /* 撑满 #page（即视口内容区，含 topbar 外的全部高度） */
    min-height:100%;
    margin-top:-4px;          /* 抵消 #page 的 padding-top:4px，消除顶部空隙 */
    padding:0 6px;            /* 移除上下内边距，左右留白避免贴边 */
    gap:6px;
  }
  /* 日历条保持自然高度；每日一句放大，按比例瓜分剩余空间 */
  .dash-sec > .cal-bar{
    flex:0 0 auto;
    margin-bottom:0;
  }
  .dash-sec > .quote-card{
    flex:1 1 0;
    min-height:0;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  /* 两张卡片自动撑高；"日日是好日"维持主导；"今日复盘"缩小为紧凑单块 */
  .dash-sec > .card{
    flex:4.5 1 0;
    min-height:0;
    display:flex;
    flex-direction:column;
    margin-bottom:0;
  }
  .dash-sec > .review-card{ flex:0 0 auto; justify-content:center; padding:11px 13px; }
  /* 复盘单块在移动端紧凑化 */
  .dash-sec .review-card .rev-single{font-size:13px}
  .dash-sec .review-card .rev-title{font-size:15px}
  .dash-sec .review-card .rev-status{font-size:10.5px}
  .dash-sec .review-card .rev-total{font-size:12px;gap:5px}
  .dash-sec .review-card .rev-total b{font-size:16px}

  /* HHD 卡片内：标题与进度条小间距，避免挤占 4 行空间 */
  .dash-sec .hhd-head{margin-bottom:4px}
  .dash-sec .progress-bar{margin-top:4px}

  /* HHD 网格：2列×4行，均匀填满撑高的卡片 */
  .dash-sec .card .hhd-grid{
    flex:1 1 0;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:8px;
  }
  /* 大卡片外观，充分利用空间 */
  .dash-sec .card .hhd-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:0;
    padding:14px 10px 12px;border-radius:14px;
  }
  .dash-sec .card .hhd-ico{font-size:26px;line-height:1}
  .dash-sec .card .hhd-name{font-size:13px;margin-top:5px;line-height:1.3}
  .dash-sec .card .hhd-sub{font-size:11px;margin-top:2px;line-height:1.3}
  .dash-sec .card .hhd-check{top:6px;right:6px;width:22px;height:22px;font-size:11px;border-width:2px}

  /* 今日计划 移动端微调 */
  .today-sec{padding:0 6px}
  .tp-list{gap:8px;padding-bottom:70px}
  .tp-tab{padding:9px 4px;font-size:13px}
  .tp-cal-inline.open{max-height:380px;padding:12px;margin-bottom:8px}
  .tp-cal-inline .tp-cal-day{font-size:11.5px}
  .tp-fab{width:54px;height:54px;right:16px;bottom:22px;font-size:26px}
  .tp-cat{padding:12px 13px;border-radius:18px}
  .tp-item{padding:5px 0}
  .tp-modal-card,.tp-cal-card{padding:14px;border-radius:22px}
  .tp-section{padding:8px 10px;margin-bottom:8px}
  .tp-section-title{font-size:11.5px;margin-bottom:4px}
  .tp-switch-row{padding:7px 0}
  .tp-switch{width:40px;height:24px}
  .tp-switch::after{width:20px;height:20px}
  .tp-switch:checked::after{transform:translateX(16px)}
  .tp-switch-panel{padding:2px 0 6px 30px}
  .tp-modal-head{font-size:16px;margin-bottom:10px}
  .tp-field{margin-bottom:8px}
  .tp-pill{padding:5px 10px;font-size:12px}
  .tp-cancel,.tp-save{height:40px;font-size:14px}
  /* 待处理区 移动端紧凑 */
  .od-card{padding:8px 10px;margin-bottom:6px}
  .od-title{font-size:13px}
  .od-carry{padding:4px 9px;font-size:10.5px}
}
/* ====== Responsive: Tablet (iPad 横竖屏 768 – 1024px) ====== */
@media(min-width:768px) and (max-width:1024px){
  :root{--sw:200px}
  #sidebar{
    padding:14px 8px 10px;
    background:#E0D8EE;
    border-right:1px solid #C9BEDF;
    /* 关闭移动端抽屉，不使用 fixed 定位 */
    position:relative;left:auto;top:auto;bottom:auto;transform:none;
    box-shadow:none;
  }
  #menuBtn{display:none}
  #overlay{display:none}
  .sidebar-head{padding:9px 4px 12px;gap:9px}
  .sidebar-head .logo{font-size:23px}
  .sidebar-head .name{font-size:13.5px}
  .sidebar-head .name small{font-size:9.5px;margin-top:2px}
  .nav-group-label{font-size:10px;padding:11px 4px 6px;letter-spacing:.9px}
  .nav-item{
    padding:7px 4px;margin-bottom:5px;
    border-radius:12px;min-height:64px;gap:5px;
  }
  .nav-item .ico{font-size:21px;width:36px;height:36px;border-radius:9px}
  .nav-item .lbl{
    font-size:11px;line-height:1.22;
    white-space:normal;overflow:visible;text-overflow:clip;
    max-height:2.44em;max-width:100%;word-break:break-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  /* iPad 触控为主：只保留 :active 反馈，避免点击后停留 hover 缩放 */
  .nav-item:hover{transform:none;background:transparent;box-shadow:none;color:var(--t2)}
  .nav-item:active{transform:scale(.96)}
  .nav-item.active{font-weight:700;background:transparent;box-shadow:none;border-color:transparent}
  .nav-item.active .ico{background:linear-gradient(135deg,var(--lav2),var(--lav));color:#fff;box-shadow:0 4px 12px rgba(126,117,158,.35);transform:scale(1.06)}
  .nav-item.add-module{min-height:64px;border-width:2px}
  .nav-item.add-module .ico{font-size:21px}
  .nav-lock{padding:7px;margin-top:4px;font-size:11px}
  .nav-spacer{min-height:6px}
  /* 内容区在 iPad 横向时给足留白 */
  .sec{padding:14px}
  .card{padding:16px;margin-bottom:12px;border-radius:20px}
  .card-title{font-size:17px;margin-bottom:12px}
  .grid3{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid2{gap:10px}
  /* iPad 上首页适度铺满 */
  .dash-sec{
    display:flex;flex-direction:column;min-height:100%;
    padding:0 14px;gap:12px;
  }
  .dash-sec > .cal-bar{flex:0 0 auto;margin-bottom:0}
  .dash-sec > .quote-card{flex:1 1 0;min-height:0;margin-bottom:0;display:flex;flex-direction:column;justify-content:center}
  .dash-sec > .card{flex:4 1 0;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
  .dash-sec > .review-card{flex:0 0 auto;justify-content:center;padding:14px 16px}
  .dash-sec .card .hhd-grid{
    flex:1 1 0;min-height:0;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:10px;
  }
  .dash-sec .card .hhd-item{
    min-height:0;padding:12px 38px 12px 12px;border-radius:14px;
    grid-template-columns:38px minmax(0,1fr);
    gap:10px;
  }
  .dash-sec .card .hhd-ico-wrap{width:38px;height:38px}
  .dash-sec .card .hhd-ico{font-size:22px;line-height:1}
  .dash-sec .card .hhd-name{font-size:13.5px;line-height:1.3}
  .dash-sec .card .hhd-sub{font-size:11.5px;line-height:1.3}
  .dash-sec .card .hhd-check{top:8px;right:8px;width:24px;height:24px;font-size:12px;border-width:2px}
}

/* ====== Responsive: Desktop (Mac ≥1025px) ====== */
@media(min-width:1025px){
  #menuBtn{display:none}
  #overlay{display:none}
  /* 桌面端首页同样撑满视口，2列×4行铺满 */
  .dash-sec{

  }
  .dash-sec > .cal-bar{flex:0 0 auto;margin-bottom:0}

  .dash-sec .card .hhd-item{

    gap:14px;
  }
  .dash-sec .card .hhd-ico-wrap{width:46px;height:46px}

<body>

<!-- Password Gate -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-icon" id="gateIcon">💃🏻</div>
    <div class="gate-title" id="gateTitle">winwin行动</div>
    <div class="gate-sub" id="gateSub">请输入密码进入</div>
    <input type="email" class="gate-input" id="gateEmail" placeholder="邮箱（首次或切换账号时填写）" autocomplete="off" style="letter-spacing:0;font-size:15.5px;margin-bottom:12px;display:none">
    <input type="password" class="gate-input" id="gateInput" placeholder="输入密码" autocomplete="off">
    <button class="gate-btn" id="gateBtn">进入</button>
    <div class="gate-hint" id="gateHint">首次使用请设置你的密码</div>
    <div class="gate-switch" id="gateSwitch">使用其他账号</div>
  </div>
</div>

<!-- Add Module Modal -->
<div id="moduleModal" onclick="if(event.target===this)closeModuleModal()">
  <div class="modal-card">
    <div class="modal-title">✨ 添加新模块</div>
    <div class="modal-row">
      <label>模块名称</label>
      <input type="text" id="moduleName" placeholder="例如：阅读清单" maxlength="8" onkeydown="if(event.key==='Enter')confirmAddModule()">
    </div>
    <div class="modal-row">
      <label>图标（选一个 emoji）</label>
      <input type="text" id="moduleIcon" placeholder="📖" maxlength="2" onkeydown="if(event.key==='Enter')confirmAddModule()">
    </div>
    <div class="modal-row">
      <label>模块类型</label>
      <select id="moduleType">
        <option value="notes">便签笔记</option>
        <option value="todo">待办清单</option>
        <option value="checkin">每日打卡</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModuleModal()">取消</button>
      <button class="btn-confirm" onclick="confirmAddModule()">添加</button>
    </div>
  </div>
</div>

<!-- Calendar Modal -->
<div id="calModal" onclick="if(event.target===this)closeCalendar()">
  <div class="cal-modal-card">
    <div class="cal-modal-head">
      <button class="cal-nav" onclick="changeCalMonth(-1)">‹</button>
      <div class="cal-title">
        <select id="calYear" onchange="changeCalYear(this.value)"></select>
        <span id="calMonthLabel"></span>
      </div>
      <button class="cal-nav" onclick="changeCalMonth(1)">›</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-days" id="calDays"></div>
    <button class="cal-today-btn" onclick="jumpCalToday()">回到今天</button>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none">
  <!-- Sidebar -->
  <aside id="sidebar"></aside>
  <div id="overlay"></div>
  
  <!-- Content -->
  <div id="content">
    <header id="topbar">
      <button id="menuBtn">☰</button>
      <span id="pageTitle">首页</span>
    </header>
    <main id="page"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=202608061900"></script>
</body>
